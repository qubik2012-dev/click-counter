<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Счетчик коммуникаций</title>
    <style>
        :root {
            --bg-body: #f0f2f5;
            --bg-card: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #eeeeee;
            --input-border: #dddddd;
            --shadow: rgba(0, 0, 0, 0.1);
            --table-row-bg: #f9f9f9;
            --overlay-bg: rgba(0, 0, 0, 0.4);
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --input-border: #444444;
            --shadow: rgba(0, 0, 0, 0.5);
            --table-row-bg: #252525;
            --overlay-bg: rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-body);
            padding: 20px;
            transition: background-color 0.2s;
        }

        .counter-container {
            background: var(--bg-card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px var(--shadow);
            text-align: center;
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            z-index: 10;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 5px;
            font-size: 24px;
        }

        .cycle-info {
            font-size: 14px;
            color: #007bff;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .display {
            font-size: 64px;
            font-weight: bold;
            color: #007bff;
            margin: 15px 0;
            word-wrap: break-word;
        }

        .main-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.05s, opacity 0.1s;
        }

        button:active { transform: scale(0.96); }

        .btn-decrease { background-color: #dc3545; color: white; flex: 1; font-size: 20px; }
        .btn-increase { background-color: #28a745; color: white; flex: 1; font-size: 20px; }
        .btn-set { background-color: #007bff; color: white; padding: 10px 15px; font-size: 15px; }
        
        .btn-end-day { 
            background-color: #ffc107; 
            color: #212529; 
            width: 100%; 
            font-size: 15px; 
            padding: 12px;
            margin-top: 15px;
        }
        .btn-end-day.cycle-finished {
            background-color: #6f42c1;
            color: white;
        }

        .btn-report {
            background-color: #6c757d;
            color: white;
            width: 100%;
            font-size: 14px;
            padding: 10px;
            margin-top: 15px;
        }

        .btn-hard-reset {
            background-color: transparent;
            color: #dc3545;
            border: 1px dashed #dc3545;
            width: 100%;
            font-size: 12px;
            padding: 8px;
            margin-top: 25px;
            opacity: 0.6;
        }
        .btn-hard-reset:hover { opacity: 1; background-color: rgba(220, 53, 69, 0.1); }

        .set-value-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        input[type="number"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 2px solid var(--input-border);
            background-color: var(--bg-card);
            color: var(--text-main);
            border-radius: 8px;
            outline: none;
        }

        input[type="number"]:focus { border-color: #007bff; }

        .section-title {
            font-size: 15px;
            color: var(--text-main);
            margin: 25px 0 10px;
            text-align: left;
            font-weight: 600;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            font-size: 14px;
            text-align: left;
            color: var(--text-main);
        }

        .history-table th, .history-table td {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .history-table th {
            background-color: var(--border-color);
            color: var(--text-main);
            font-weight: 600;
        }

        .history-table tr:nth-child(even) { background-color: var(--table-row-bg); }

        .current-row {
            outline: 2px solid #007bff;
            background-color: rgba(0, 123, 255, 0.05) !important;
            font-weight: bold;
        }

        .text-center { text-align: center; }
        .text-blue { color: #007bff; font-weight: bold; }
        .text-purple { color: #6f42c1; font-weight: bold; }

        .archive-box {
            max-height: 120px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        /* Стили модального окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .btn-close-modal {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: var(--text-muted);
        }

        .report-list {
            overflow-y: auto;
            flex: 1;
            list-style: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            background: var(--bg-body);
            text-align: left;
            font-size: 14px;
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border-color);
            color: var(--text-muted);
        }

        .report-item:last-child { border-bottom: none; }
        .text-plus { color: #28a745; font-weight: bold; }
        .text-minus { color: #dc3545; font-weight: bold; }
        .empty-text { text-align: center; color: var(--text-muted); padding: 15px 0; font-size: 13px; }
    </style>
</head>
<body>

    <div class="counter-container">
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>

        <h1>📊 Счетчик коммуникаций</h1>
        <div class="cycle-info" id="cycle-day-title">Текущий шаг: День 1 из 10</div>
        
        <div class="display" id="counter-value">0</div>

        <div class="main-buttons">
            <button class="btn-decrease" onclick="changeValue(-1)">➖</button>
            <button class="btn-increase" onclick="changeValue(1)">➕</button>
        </div>

        <div class="set-value-container">
            <input type="number" id="custom-input" placeholder="Введите число">
            <button class="btn-set" onclick="setCustomValue()">🎯 Задать</button>
        </div>

        <button class="btn-end-day" id="action-day-btn" onclick="handleDayAction()">🌅 Завершить день 1</button>

        <!-- РАЗДЕЛ 1: Таблица текущей декады -->
        <div class="section-title">📅 Таблица текущей декады</div>
        <table class="history-table">
            <thead>
                <tr>
                    <th style="width: 25%;">День</th>
                    <th style="width: 45%;">Дата записи</th>
                    <th style="width: 30%; text-align: center;">Результат</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>

        <button class="btn-report" onclick="openReportModal()">📋 Посмотреть отчет за сегодня</button>

        <!-- РАЗДЕЛ 2: Архив завершенных декад -->
        <div class="section-title">🗄️ Архив завершенных декад</div>
        <div class="archive-box">
            <table class="history-table" style="margin-top: 0;">
                <thead>
                    <tr>
                        <th>Период</th>
                        <th>Дата закрытия</th>
                        <th style="text-align: center;">Всего кликов</th>
                    </tr>
                </thead>
                <tbody id="archive-table-body"></tbody>
            </table>
        </div>

        <button class="btn-hard-reset" onclick="hardResetEverything()">⚠️ Полный сброс всего приложения</button>
    </div>

    <!-- Модальное окно для отчета -->
    <div class="modal-overlay" id="report-modal" onclick="closeReportModalViaOverlay(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📋 Лог кликов за сегодня</h3>
                <button class="btn-close-modal" onclick="closeReportModal()">&times;</button>
            </div>
            <ul class="report-list" id="report-list-container"></ul>
        </div>
    </div>

    <script>
        const counterDisplay = document.getElementById('counter-value');
        const customInput = document.getElementById('custom-input');
        const tableBody = document.getElementById('table-body');
        const archiveTableBody = document.getElementById('archive-table-body');
        const themeBtn = document.getElementById('theme-btn');
        const cycleTitle = document.getElementById('cycle-day-title');
        const actionBtn = document.getElementById('action-day-btn');
        const reportModal = document.getElementById('report-modal');
        const reportListContainer = document.getElementById('report-list-container');

        let count = parseInt(localStorage.getItem('tabCounterValue')) || 0;
        let currentDayIndex = parseInt(localStorage.getItem('tabCurrentDayIndex')) || 0; 
        let isCycleFinished = localStorage.getItem('tabIsCycleFinished') === 'true' || false;
        let currentTheme = localStorage.getItem('counterTheme') || 'light';
        let todayLog = JSON.parse(localStorage.getItem('tabTodayLog')) || [];
        let globalArchive = JSON.parse(localStorage.getItem('tabGlobalArchive')) || [];

        let cycleData = JSON.parse(localStorage.getItem('tabCycleData')) || Array.from({length: 10}, (_, i) => ({
            dayNum: i + 1, date: '-', val: '-'
        }));

        document.documentElement.setAttribute('data-theme', currentTheme);
        themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        buildTableStructure();
        updateDisplay();
        updateUIControls();
        renderArchive();
        checkAndCleanNewDay();

        function playClick(isIncrease = true) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(isIncrease ? 800 : 600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.05);
            } catch (e) {}
        }

        function updateDisplay() {
            counterDisplay.textContent = count;
            localStorage.setItem('tabCounterValue', count);
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('counterTheme', currentTheme);
            themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        }

        function updateUIControls() {
            if (isCycleFinished) {
                cycleTitle.textContent = "🎉 Декада успешно завершена!";
                actionBtn.textContent = "🔄 Заархивировать и начать новую";
                actionBtn.className = "btn-end-day cycle-finished";
            } else {
                cycleTitle.textContent = `Текущий шаг: День ${currentDayIndex + 1} из 10`;
                actionBtn.textContent = `🌅 Завершить день ${currentDayIndex + 1}`;
                actionBtn.className = "btn-end-day";
            }
            updateTableRowsHighlight();
        }

        function buildTableStructure() {
            let html = '';
            for (let i = 0; i < 10; i++) {
                html += `
                    <tr id="row-${i}">
                        <td>День ${cycleData[i].dayNum}</td>
                        <td id="date-${i}">${cycleData[i].date}</td>
                        <td id="val-${i}" class="text-center">${cycleData[i].val}</td>
                    </tr>
                `;
            }
            tableBody.innerHTML = html;
        }

        function updateTableRowsHighlight() {
            for (let i = 0; i < 10; i++) {
                const row = document.getElementById(`row-${i}`);
                const valCell = document.getElementById(`val-${i}`);
                
                document.getElementById(`date-${i}`).textContent = cycleData[i].date;
                valCell.textContent = cycleData[i].val;
                
                if (cycleData[i].val !== '-') {
                    valCell.classList.add('text-blue');
                } else {
                    valCell.classList.remove('text-blue');
                }

                if (i === currentDayIndex && !isCycleFinished) {
                    row.classList.add('current-row');
                } else {
                    row.classList.remove('current-row');
                }
            }
        }

        function renderArchive() {
            if (globalArchive.length === 0) {
                archiveTableBody.innerHTML = '<tr><td colspan="3" class="empty-text">Архив пока пуст. Завершите первую декаду!</td></tr>';
                return;
            }
            let html = '';
            globalArchive.forEach(item => {
                html += `
                    <tr>
                        <td>Декада №${item.id}</td>
                        <td>${item.endDate}</td>
                        <td class="text-center text-purple">${item.totalSum}</td>
                    </tr>
                `;
            });
            archiveTableBody.innerHTML = html;
        }

        function appendToTodayLog(type, value) {
            const now = new Date();
            todayLog.unshift({
                date: now.toLocaleDateString('ru-RU'),
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                type: type, val: value
            });
            if (todayLog.length > 150) todayLog.pop();
            localStorage.setItem('tabTodayLog', JSON.stringify(todayLog));
        }

        // Фикс бага: проверка даты по первому элементу массива лога
        function checkAndCleanNewDay() {
            if (todayLog.length > 0) {
                const currentToday = new Date().toLocaleDateString('ru-RU');
                if (todayLog[0].date !== currentToday) {
                    todayLog = [];
                    localStorage.setItem('tabTodayLog', JSON.stringify(todayLog));
                }
            }
        }

        function handleDayAction() {
            if (isCycleFinished) {
                const totalSum = cycleData.reduce((acc, item) => acc + (parseInt(item.val) || 0), 0);
                const todayStr = new Date().toLocaleDateString('ru-RU');
                
                globalArchive.unshift({
                    id: globalArchive.length + 1,
                    endDate: todayStr,
                    totalSum: totalSum
                });

                localStorage.setItem('tabGlobalArchive', JSON.stringify(globalArchive));
                
                resetCurrentDecadeStructure();
                renderArchive();
                playClick(true);
            } else {
                const todayStr = new Date().toLocaleDateString('ru-RU');
                cycleData[currentDayIndex].date = todayStr;
                cycleData[currentDayIndex].val = count;
                
                if (currentDayIndex < 9) {
                    currentDayIndex++;
                } else {
                    isCycleFinished = true; 
                }
                
                count = 0; 
                todayLog = [];
                
                localStorage.setItem('tabCycleData', JSON.stringify(cycleData));
                localStorage.setItem('tabTodayLog', JSON.stringify(todayLog));
                localStorage.setItem('tabCurrentDayIndex', currentDayIndex);
                localStorage.setItem('tabIsCycleFinished', isCycleFinished);
                
                playClick(false);
                updateDisplay();
                updateUIControls();
            }
        }

        function resetCurrentDecadeStructure() {
            count = 0;
            currentDayIndex = 0;
            isCycleFinished = false;
            todayLog = [];
            cycleData = Array.from({length: 10}, (_, i) => ({
                dayNum: i + 1, date: '-', val: '-'
            }));
            
            localStorage.setItem('tabCycleData', JSON.stringify(cycleData));
            localStorage.setItem('tabTodayLog', JSON.stringify(todayLog));
            localStorage.setItem('tabCurrentDayIndex', currentDayIndex);
            localStorage.setItem('tabIsCycleFinished', isCycleFinished);
            
            updateDisplay();
            updateUIControls();
        }

        function hardResetEverything() {
            if (confirm("⚠️ ВНИМАНИЕ! Это действие безвозвратно удалит текущий счетчик, таблицу дней и ВЕСЬ архив прошлых декад. Продолжить?")) {
                if (confirm("Вы абсолютно уверены? Восстановить данные будет невозможно.")) {
                    localStorage.clear(); // Полная безопасная очистка кэша

                    count = 0;
                    currentDayIndex = 0;
                    isCycleFinished = false;
                    todayLog = [];
                    globalArchive = [];
                    cycleData = Array.from({length: 10}, (_, i) => ({
                        dayNum: i + 1, date: '-', val: '-'
                    }));

                    updateDisplay();
                    updateUIControls();
                    renderArchive();
                    playClick(false);
                    alert("Приложение полностью очищено!");
                }
            }
        }

        function changeValue(step) {
            if (isCycleFinished) return;
            count += step;
            if (count < 0) count = 0; 
            updateDisplay();
            playClick(step > 0);
            appendToTodayLog('change', step);
        }

        function setCustomValue() {
            if (isCycleFinished) return;
            const inputVal = customInput.value.trim();
            if (inputVal === '') return; 
            
            const val = parseInt(inputVal);
            if (!isNaN(val) && val >= 0) {
                count = val;
                updateDisplay(); // Фикс бага: принудительное сохранение в LocalStorage
                playClick(true);
                customInput.value = '';
                appendToTodayLog('set', val);
            }
        }

        function openReportModal() {
            checkAndCleanNewDay();
            reportListContainer.innerHTML = '';
            
            if (todayLog.length === 0) {
                reportListContainer.innerHTML = '<li class="report-empty">За сегодня изменений еще не было</li>';
            } else {
                let html = '';
                todayLog.forEach(item => {
                    let text = '';
                    if (item.type === 'change') {
                        text = item.val > 0 ? `<span class="text-plus">+${item.val}</span>` : `<span class="text-minus">${item.val}</span>`;
                    } else if (item.type === 'set') {
                        text = `🎯 Задано: <b>${item.val}</b>`;
                    }
                    html += `<li class="report-item"><span>${text}</span><span>${item.time}</span></li>`;
                });
                reportListContainer.innerHTML = html;
            }
            reportModal.classList.add('active');
        }

        function closeReportModal() { reportModal.classList.remove('active'); }
        function closeReportModalViaOverlay(e) { if (e.target === reportModal) closeReportModal(); }
    </script>
</body>
</html>
